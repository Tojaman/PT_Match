auth_enabled: false

server:
  http_listen_port: 3100

common:
  instance_addr: 127.0.0.1 # 통신을 위해서 Ingester(저장 담당)과 Querier(검색 담당) 노드 각각 자신의 ip (현재는 통합해서 사용하기 때문에 로컬호스트)
  path_prefix: /tmp/loki
  storage:
    filesystem:
      chunks_directory: /tmp/loki/chunks
      rules_directory: /tmp/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
