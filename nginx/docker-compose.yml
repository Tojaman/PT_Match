  minio:
    # (이건 고급 메뉴 없는 버전이라 사용X) minio가 공식적으로 docker hub 이미지를 제공하지 않으므로 chainguard의 이미지를 사용
#    image: cgr.dev/chainguard/minio:latest

    # 일반 사용자가 올린 고급 메뉴 있는 버전
    image: firstfinger/minio:latest-arm64
    container_name: minio
    restart: always
    user: "0:0" # data 볼륨 쓰기 권한을 위해 루트 계정으로 실행
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
      - "9002:9002"
    volumes:
      - minio-data:/data

volumes:
  # certbot-conf:
  # certbot-www:
  minio-data:
  mysql-data:
  postgres_data:
    external: true
    name: pt_match_postgres_data
