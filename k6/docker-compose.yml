version: '3.8'

services:
  k6:
    # k6 공식 도커 이미지
    image: grafana/k6

    # 컨테이너의 작업 디렉토리 설정
    working_dir: /scripts

    # 로컬의 scripts 폴더를 컨테이너의 /scripts 폴더에 마운트
    volumes:
      - ./scripts:/scripts

    # 컨테이너 실행 시 실행할 명령어
    # matching-test.js 스크립트를 실행합니다.
#    command: run matching-test.js
    command: run multi-schedule-deadlock-test.js

    # Docker 컨테이너가 호스트 머신(Host PC)에 접근하기 위한 설정
    # host.docker.internal을 통해 localhost에 접근할 수 있게 됩니다.
    extra_hosts:
      - "host.docker.internal:host-gateway"
