name: ci-cd

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
      SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
      SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
      SPRING_JWT_SECRET: ${{ secrets.SPRING_JWT_SECRET }}
      SPRING_PROFILES_ACTIVE: prod

    steps:
      # 테스트는 나중에 할 예정
      - name: Checkout repository
        uses: actions/checkout@v4
      #
      #      - name: Set up JDK 17
      #        uses: actions/setup-java@v4
      #        with:
      #          distribution: temurin
      #          java-version: 17
      #          cache: gradle
      #
      #      - name: Run tests
      #        run: ./gradlew test

      # main 외 브렌치 또는 PR 에 대해서는 이미지 빌드만 수행하여 검증
      - name: Build Docker image (validation)
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: docker build -t pt-match-app .

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin

      - name: Set up Docker Buildx
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Build and push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ptmatch:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Deploy to home server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" -p "${{ secrets.DOCKERHUB_TOKEN }}"
            docker pull "${{ secrets.DOCKERHUB_USERNAME }}/ptmatch:latest"
            cd "${{ secrets.DEPLOY_WORKDIR }}"
            docker compose down --remove-orphans || true
            docker rm -f ptmatch || true
            docker compose pull
            docker compose up -d --remove-orphans
