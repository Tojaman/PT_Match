spring:
  application:
    name: ptmatch
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    # hibernate:
    # ddl-auto: update
    properties:
      hibernate:
        default_batch_fetch_size: 100
security:
  jwt:
    access-token-validity-ms: ${JWT_ACCESS_TOKEN_VALIDITY_MS}
    refresh-token-validity-ms: ${JWT_REFRESH_TOKEN_VALIDITY_MS}
payment:
  order-ttl: ${PAYMENT_ORDER_TTL}
  success-url: ${PAYMENT_SUCCESS_URL}
  fail-url: ${PAYMENT_FAIL_URL}
  retry:
    backoff-delays: [1m, 2m, 4m, 8m, 16m, 30m, 30m]
    max-attempts: 7
    resolve-deadline: 90m
    reconcile-interval: 30s
    reconcile-batch-size: 50
    approving-stale-threshold: 2m
  toss:
    base-url: ${TOSS_BASE_URL}
    client-key: ${TOSS_CLIENT_KEY}
    secret-key: ${TOSS_SECRET_KEY}
resend:
  api-key: ${RESEND_API_KEY}
  from-email: ${RESEND_FROM_EMAIL:PTMatch <noreply@ptmatch.com>}
email:
  outbox:
    poll-interval: 5000
    batch-size: 20
    max-retry: 5
management:
  endpoints: # 입구 개방(prometheus)
    web:
      exposure: # /actuator/{include}
        include: health, info, prometheus
  tracing: # 추적 설정
    sampling:
      probability: 1.0
    propagation:
      type: w3c
  otlp:
    tracing: # 데이터 내보내기(OTEL)
      endpoint: ${OTLP_ENDPOINT}
      transport: http
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    console: "%5p [%t] [%X{traceId:-},%X{spanId:-}] %c{1} - %m%n"
  level:
    root: INFO
    com.solo.ptmatch: DEBUG
    org.springframework.web.servlet.DispatcherServlet: DEBUG
    net.ttddyy.observation: INFO
