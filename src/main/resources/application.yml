spring:
    profiles:
        active: ${SPRING_PROFILES_ACTIVE:dev}
    jpa:
        hibernate:
            ddl-auto: update
        properties:
            hibernate:
                default_batch_fetch_size: 100

security:
    jwt:
        access-token-validity-ms: 3600000

logging:
    level:
        org.hibernate.SQL: debug
        org.hibernate.type.descriptor.sql.BasicBinder: trace
