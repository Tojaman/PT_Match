spring:
    datasource:
        url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ptmatch?useSSL=false&allowPublicKeyRetrieval=true}
        username: ${SPRING_DATASOURCE_USERNAME:root}
        password: ${SPRING_DATASOURCE_PASSWORD:0000}
        driver-class-name: com.mysql.cj.jdbc.Driver
    jpa:
        hibernate:
            ddl-auto: update
        properties:
            hibernate:
                show_sql: true

security:
    jwt:
        secret: ${SPRING_JWT_SECRET}

minio:
    endpoint: ${MINIO_ENDPOINT}
    bucket: ${MINIO_BUCKET:ptmatch}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    presign-expiry: ${MINIO_PRESIGN_EXPIRY:15m}
    public-url: ${MINIO_PUBLIC_URL}
