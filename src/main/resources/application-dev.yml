spring:
    datasource:
        url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/ptmatch}
        username: ${SPRING_DATASOURCE_USERNAME:ptmatch}
        password: ${SPRING_DATASOURCE_PASSWORD:ptmatch1234}
        driver-class-name: org.postgresql.Driver
        hikari:
            maximum-pool-size: 20
    jpa:
        hibernate:
            ddl-auto: update
        properties:
            hibernate:
                show_sql: false
        database-platform: org.hibernate.spatial.dialect.postgis.PostgisPG10Dialect
    data:
        redis:
            host: ${REDIS_HOST}
            port: ${REDIS_PORT}
            lettuce:
                pool:
                    max-active: 50    # 최대 연결 수
                    max-idle: 20      # 유휴 연결 최대 수
                    min-idle: 5       # 유휴 연결 최소 수
                    max-wait: 3000ms  # 연결 대기 시간

security:
    cookie:
        secure: false
    jwt:
        secret: ${SPRING_JWT_SECRET}
        access-token-validity-ms: ${JWT_ACCESS_TOKEN_VALIDITY_MS:3600000}
        refresh-token-validity-ms: ${JWT_REFRESH_TOKEN_VALIDITY_MS:1209600000}

minio:
    endpoint: ${MINIO_ENDPOINT}
    bucket: ${MINIO_BUCKET:ptmatch}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    presign-expiry: ${MINIO_PRESIGN_EXPIRY:15m}
    public-url: ${MINIO_PUBLIC_URL}

loki:
    url: ${LOKI_ENDPOINT}
